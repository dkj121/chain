<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#grad)"/>
  <g fill="white" opacity="0.95">
    <!-- Chain links -->
    <circle cx="38" cy="64" r="14" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="64" cy="64" r="14" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="90" cy="64" r="14" fill="none" stroke="white" stroke-width="4"/>
    <!-- Connecting bars -->
    <rect x="48" y="61" width="10" height="6" rx="3"/>
    <rect x="70" y="61" width="10" height="6" rx="3"/>
  </g>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">CHAIN</text>
</svg>
